<body class="apple-intelligence-theme" oncontextmenu="return false;">
  <app-root></app-root>

  <!-- Anti-Inspection & Source Code Defense -->
  <script>
    (function() {
      // 1. Disable context menu (Inspect Element)
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      }, { passive: false });

      // 2. Disable DevTools & Source Inspecting Key Combinations
      document.addEventListener('keydown', function(e) {
        // F12
        if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
          return false;
        }
        // Ctrl+Shift+I / Cmd+Opt+I (Inspect)
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) {
          e.preventDefault();
          return false;
        }
        // Ctrl+Shift+J / Cmd+Opt+J (Console)
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) {
          e.preventDefault();
          return false;
        }
        // Ctrl+Shift+C / Cmd+Opt+C (Inspect Element Picker)
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) {
          e.preventDefault();
          return false;
        }
        // Ctrl+U / Cmd+U (View Source)
        if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
          e.preventDefault();
          return false;
        }
        // Ctrl+S / Cmd+S (Save Page Source)
        if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
          const tag = e.target && e.target.tagName;
          if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
            e.preventDefault();
            return false;
          }
        }
      }, { passive: false });

      // 3. Prevent dragging images/assets
      document.addEventListener('dragstart', function(e) {
        if (e.target && e.target.nodeName === 'IMG') {
          e.preventDefault();
          return false;
        }
      }, { passive: false });
    })();
  </script>
