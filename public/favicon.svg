<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0077b6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle with Gradient -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="12" filter="url(#subtleGlow)"/>

  <!-- Inner Subtle Ambient Ring -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"/>

  <!-- VR Monogram Typography -->
  <text 
    x="50%" 
    y="52%" 
    font-family="system-ui, -apple-system, 'SF Pro Display', 'Roboto', 'Segoe UI', sans-serif" 
    font-size="228" 
    font-weight="900" 
    letter-spacing="-0.04em" 
    fill="#ffffff" 
    text-anchor="middle" 
    dominant-baseline="middle"
    style="text-shadow: 0 4px 12px rgba(0, 50, 90, 0.3);">VR</text>
</svg>
